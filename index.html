<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Local Lead Finder — Businesses Without Websites</title>

  <!-- Leaflet.js via CDN -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
        crossorigin="" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
          crossorigin=""></script>

  <style>
    :root {
      --bg:        #0b0f14;
      --bg-soft:   #12181f;
      --bg-card:   #1a222c;
      --bg-hover:  #22303e;
      --border:    #2b3947;
      --text:      #e6edf3;
      --text-dim:  #8b98a5;
      --accent:    #ef4444;
      --accent-2:  #f97316;
      --ok:        #22c55e;
      --shadow:    0 4px 18px rgba(0, 0, 0, 0.45);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      overflow: hidden;
    }

    #app {
      display: flex;
      height: 100vh;
    }

    /* ----------------------------- Sidebar ----------------------------- */
    #sidebar {
      width: 440px;
      min-width: 340px;
      height: 100vh;
      display: flex;
      flex-direction: column;
      background: var(--bg-soft);
      border-right: 1px solid var(--border);
      z-index: 1000;
    }

    .sidebar-header {
      padding: 20px 22px 14px;
      border-bottom: 1px solid var(--border);
      background: linear-gradient(180deg, #151d26 0%, var(--bg-soft) 100%);
    }

    .sidebar-header h1 {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 0.4px;
    }

    .sidebar-header h1 span { color: var(--accent); }

    .sidebar-header p {
      margin-top: 4px;
      font-size: 13px;
      color: var(--text-dim);
    }

    .controls {
      padding: 16px 22px;
      border-bottom: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .controls-row {
      display: flex;
      gap: 10px;
    }

    .field {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .field label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--text-dim);
      font-weight: 600;
    }

    input[type="text"], select {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--bg-card);
      color: var(--text);
      font-size: 14px;
      outline: none;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    input[type="text"]:focus, select:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.18);
    }

    input[type="text"]::placeholder { color: #56636f; }

    select {
      appearance: none;
      cursor: pointer;
    }

    select option { background: var(--bg-card); }

    button {
      padding: 11px 14px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: #fff;
      transition: transform 0.12s ease, box-shadow 0.12s ease, opacity 0.15s ease;
      box-shadow: 0 4px 14px rgba(239, 68, 68, 0.35);
    }

    button:hover:not(:disabled) {
      transform: translateY(-1px);
      box-shadow: 0 6px 18px rgba(239, 68, 68, 0.45);
    }

    button:disabled { opacity: 0.55; cursor: not-allowed; }

    .secondary-btn {
      flex: 1;
      padding: 10px 12px;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      color: #fff;
      transition: transform 0.12s ease, box-shadow 0.12s ease, opacity 0.15s ease;
    }

    .secondary-btn:hover:not(:disabled) {
      transform: translateY(-1px);
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.35);
    }

    .secondary-btn:disabled { opacity: 0.55; cursor: not-allowed; }

    .secondary-btn.primary-blue {
      background: linear-gradient(135deg, #2563eb, #06b6d4);
      box-shadow: 0 4px 14px rgba(37, 99, 235, 0.35);
    }

    .secondary-btn.primary-green {
      background: linear-gradient(135deg, #16a34a, #22c55e);
      box-shadow: 0 4px 14px rgba(34, 197, 94, 0.35);
    }

    .status {
      padding: 10px 22px;
      font-size: 13px;
      color: var(--text-dim);
      background: var(--bg);
      border-bottom: 1px solid var(--border);
      min-height: 38px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .status .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--text-dim);
      flex-shrink: 0;
    }

    .status.loading .dot { background: var(--accent-2); animation: pulse 1s infinite; }
    .status.ok .dot     { background: var(--ok); }
    .status.error .dot  { background: var(--accent); }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50%      { opacity: 0.25; }
    }

    #leadList {
      flex: 1;
      overflow-y: auto;
      padding: 14px 22px 30px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    #leadList::-webkit-scrollbar { width: 8px; }
    #leadList::-webkit-scrollbar-track { background: transparent; }
    #leadList::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 4px;
    }

    .empty-state {
      text-align: center;
      color: var(--text-dim);
      font-size: 14px;
      padding: 40px 10px;
      line-height: 1.7;
    }

    .empty-state .big { font-size: 34px; display: block; margin-bottom: 10px; }

    .lead-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-left: 4px solid var(--accent);
      border-radius: 10px;
      padding: 13px 15px;
      cursor: pointer;
      transition: background 0.12s ease, transform 0.12s ease, box-shadow 0.12s ease;
    }

    .lead-card:hover,
    .lead-card.active {
      background: var(--bg-hover);
      transform: translateX(3px);
      box-shadow: var(--shadow);
    }

    .lead-card .lead-name {
      font-size: 15px;
      font-weight: 700;
      margin-bottom: 5px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .lead-card .no-site-badge {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--accent);
      border: 1px solid var(--accent);
      border-radius: 999px;
      padding: 2px 8px;
      white-space: nowrap;
    }

    .lead-card .lead-address {
      font-size: 13px;
      color: var(--text-dim);
      margin-bottom: 4px;
      display: flex;
      align-items: flex-start;
      gap: 6px;
    }

    .lead-card .lead-phone {
      font-size: 13px;
      color: var(--text-dim);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .lead-card a {
      color: var(--ok);
      text-decoration: none;
      font-size: 13px;
    }

    .lead-card a:hover { text-decoration: underline; }

    .lead-card .card-actions {
      margin-top: 8px;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .save-btn {
      margin-left: auto;
      padding: 6px 14px;
      border: 1px solid var(--ok);
      border-radius: 8px;
      background: transparent;
      color: var(--ok);
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.12s ease, color 0.12s ease;
      box-shadow: none;
    }

    .save-btn:hover:not(:disabled) {
      background: var(--ok);
      color: #fff;
    }

    .save-btn:disabled { opacity: 0.55; cursor: not-allowed; }

    .save-btn.saved {
      background: var(--ok);
      color: #fff;
      border-color: var(--ok);
    }

    .saved-meta {
      margin-top: 6px;
      font-size: 11px;
      color: var(--text-dim);
    }

    .count-badge {
      float: right;
      font-size: 11px;
      font-weight: 600;
      color: var(--bg-soft);
      background: var(--accent);
      border-radius: 999px;
      padding: 2px 10px;
    }

    /* ------------------------------ Map -------------------------------- */
    #map {
      flex: 1;
      height: 100vh;
      background: #0d1117;
    }

    .leaflet-container { font-family: inherit; }

    .lead-pin {
      width: 20px; height: 20px;
      background: var(--accent);
      border: 3px solid #fff;
      border-radius: 50% 50% 50% 0;
      transform: rotate(-45deg);
      box-shadow: 0 3px 8px rgba(0, 0, 0, 0.6);
    }

    /* --------------------------- Responsive ------------------------------ */
    @media (max-width: 900px) {
      #app { flex-direction: column; }
      #sidebar { width: 100%; height: 50vh; min-width: 0; }
      #map { height: 50vh; }
      body { overflow: auto; }
    }
  </style>
</head>
<body>
  <div id="app">
    <!-- ========================= Sidebar ========================= -->
    <aside id="sidebar">
      <header class="sidebar-header">
        <h1>Local <span>Lead Finder</span></h1>
        <p>Businesses near you with <strong>no website</strong> — pitch them yours.</p>
      </header>

      <div class="controls">
        <div class="field">
          <label for="keyword">Business category</label>
          <input type="text" id="keyword" placeholder="e.g. dentist, restaurant, mechanic"
                 autocomplete="off" />
        </div>

        <div class="controls-row">
          <div class="field">
            <label for="radius">Search radius</label>
            <select id="radius">
              <option value="1000">1 km</option>
              <option value="3000" selected>3 km</option>
              <option value="5000">5 km</option>
              <option value="10000">10 km</option>
              <option value="25000">25 km</option>
              <option value="50000">50 km</option>
            </select>
          </div>
          <div class="field" style="flex: 0 0 auto;">
            <label>&nbsp;</label>
            <button id="scanBtn" style="white-space: nowrap;">Scan for Leads</button>
          </div>
        </div>

        <div class="controls-row" style="margin-top: 2px;">
          <button id="savedBtn" class="secondary-btn primary-blue">Saved Leads</button>
          <button id="exportBtn" class="secondary-btn primary-green">Export CSV</button>
        </div>
      </div>

      <div class="status" id="status">
        <span class="dot"></span>
        <span id="statusText">Requesting your location…</span>
      </div>

      <div id="leadList">
        <div class="empty-state">
          <span class="big">📍</span>
          Click <strong>Scan for Leads</strong> to find local businesses
          without a website.
        </div>
      </div>
    </aside>

    <!-- ============================ Map ============================= -->
    <div id="map"></div>
  </div>

  <script>
    "use strict";

    // ------------------------------------------------------------------
    // Setup the Leaflet map
    // ------------------------------------------------------------------
    const map = L.map("map").setView([20, 0], 2);

    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
      maxZoom: 19,
    }).addTo(map);

    const state = {
      center: null,     // [lat, lng] of the user
      leads: [],        // currently displayed leads
      markers: [],      // active Leaflet markers
    };

    let listMode = "scan"; // "scan" = live results, "saved" = saved leads

    const keywordInput = document.getElementById("keyword");
    const radiusSelect = document.getElementById("radius");
    const scanBtn      = document.getElementById("scanBtn");
    const savedBtn     = document.getElementById("savedBtn");
    const exportBtn    = document.getElementById("exportBtn");
    const leadList     = document.getElementById("leadList");
    const statusEl     = document.getElementById("status");
    const statusText   = document.getElementById("statusText");

    // ------------------------------------------------------------------
    // Status helper
    // ------------------------------------------------------------------
    function setStatus(message, mode) {
      statusText.textContent = message;
      statusEl.classList.remove("loading", "ok", "error");
      if (mode) statusEl.classList.add(mode);
    }

    // ------------------------------------------------------------------
    // Geolocation on load
    // ------------------------------------------------------------------
    function initLocation() {
      if (!navigator.geolocation) {
        setStatus("Geolocation not supported — using a default map view.", "error");
        map.setView([40.7128, -74.0060], 12);
        return;
      }

      setStatus("Requesting your location…", "loading");

      navigator.geolocation.getCurrentPosition(
        (pos) => {
          state.center = [pos.coords.latitude, pos.coords.longitude];
          map.setView(state.center, 13);
          setStatus("Located you. Enter a category and scan for leads.", "ok");
        },
        () => {
          // Fallback: center on New York and let the user drag the map.
          state.center = [40.7128, -74.0060];
          map.setView(state.center, 12);
          setStatus(
            "Could not get your location — centered on a default area. " +
            "Drag the map to your city before scanning.",
            "error"
          );
        },
        { enableHighAccuracy: true, timeout: 8000, maximumAge: 60000 }
      );
    }

    // ------------------------------------------------------------------
    // Fetch & display leads
    // ------------------------------------------------------------------
    async function scanForLeads() {
      if (!state.center) {
        setStatus("Still waiting for your location — try again in a second.", "error");
        return;
      }

      const keyword = keywordInput.value.trim();
      const radius  = radiusSelect.value;

      setStatus(`Scanning nearby ${keyword || "businesses"}…`, "loading");
      scanBtn.disabled = true;

      const url =
        `/api/leads?lat=${state.center[0]}&lng=${state.center[1]}` +
        `&radius=${radius}` +
        (keyword ? `&keyword=${encodeURIComponent(keyword)}` : "");

      try {
        const resp = await fetch(url);
        const data = await resp.json();

        if (!resp.ok) {
          throw new Error(data.error || `Request failed (HTTP ${resp.status})`);
        }

        state.leads = data.leads || [];
        listMode = "scan";
        renderPins();
        renderList();

        if (data.count === 0) {
          setStatus(`Scanned ${data.scanned} businesses — no leads without websites.`, "ok");
        } else {
          setStatus(
            `Scanned ${data.scanned} businesses → found ${data.count} with no website.`,
            "ok"
          );
        }
      } catch (err) {
        console.error(err);
        setStatus("Error: " + err.message, "error");
      } finally {
        scanBtn.disabled = false;
      }
    }

    // ------------------------------------------------------------------
    // Save leads (MongoDB)
    // ------------------------------------------------------------------
    async function saveLead(index, btn) {
      const lead = state.leads[index];
      if (!lead) return;

      btn.disabled = true;
      try {
        const resp = await fetch("/api/save-lead", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(lead),
        });
        const data = await resp.json();
        if (!resp.ok) throw new Error(data.error || `Request failed (HTTP ${resp.status})`);

        btn.classList.add("saved");
        btn.textContent = "Saved ✓";
        setStatus(
          data.saved
            ? `Saved ${lead.name} to your lead list.`
            : `${lead.name} was already in your saved leads.`,
          "ok"
        );
      } catch (err) {
        console.error(err);
        btn.disabled = false;
        setStatus("Error: " + err.message, "error");
      }
    }

    async function loadSavedLeads() {
      setStatus("Loading saved leads…", "loading");
      try {
        const resp = await fetch("/api/saved-leads");
        const data = await resp.json();
        if (!resp.ok) throw new Error(data.error || `Request failed (HTTP ${resp.status})`);

        state.leads = data.leads || [];
        listMode = "saved";
        renderPins();
        renderList();
        setStatus(
          state.leads.length === 0
            ? "No saved leads yet — save some from a scan."
            : `Showing ${state.leads.length} saved lead${state.leads.length === 1 ? "" : "s"}.`,
          "ok"
        );
      } catch (err) {
        console.error(err);
        setStatus("Error: " + err.message, "error");
      }
    }

    function exportCsv() {
      window.location.href = "/api/export-csv";
    }

    // ------------------------------------------------------------------
    // Markers
    // ------------------------------------------------------------------
    function clearMarkers() {
      state.markers.forEach((m) => map.removeLayer(m));
      state.markers = [];
    }

    function renderPins() {
      clearMarkers();

      const pinIcon = L.divIcon({
        className: "",
        html: '<div class="lead-pin"></div>',
        iconSize: [20, 20],
        iconAnchor: [10, 17],
        popupAnchor: [0, -18],
      });

      state.leads.forEach((lead, index) => {
        if (lead.latitude == null || lead.longitude == null) return;

        const latLng = [lead.latitude, lead.longitude];
        const marker = L.marker(latLng, { icon: pinIcon, index, title: lead.name })
          .addTo(map)
          .bindPopup(popupHtml(lead));

        marker.on("click", () => highlightCard(index));
        state.markers.push(marker);
      });
    }

    function popupHtml(lead) {
      const mapsUrl = `https://www.google.com/maps/place/?q=place_id:${encodeURIComponent(lead.place_id)}`;
      let html = `<strong>${escapeHtml(lead.name)}</strong><br/>${escapeHtml(lead.address)}`;
      if (lead.phone) html += `<br/>${escapeHtml(lead.phone)}`;
      html += `<br/><a href="${mapsUrl}" target="_blank" rel="noopener">View on Google Maps →</a>`;
      return html;
    }

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, (c) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
      }[c]));
    }

    // ------------------------------------------------------------------
    // Sidebar list
    // ------------------------------------------------------------------
    function renderList() {
      if (state.leads.length === 0) {
        leadList.innerHTML =
          (listMode === "saved")
            ? `<div class="empty-state"><span class="big">🗂️</span>` +
              `No saved leads yet.<br/>Scan for leads, then hit <strong>Save Lead</strong> on the ones you want.</div>`
            : `<div class="empty-state"><span class="big">📭</span>` +
              `No businesses without a website were found.<br/>Try a different category or radius.</div>`;
        return;
      }

      leadList.innerHTML = state.leads.map((lead, index) => {
        const mapsUrl =
          `https://www.google.com/maps/place/?q=place_id:${encodeURIComponent(lead.place_id)}`;
        const inSavedView = listMode === "saved";
        const saveBtnHtml = inSavedView
          ? `<button class="save-btn saved" disabled>Saved ✓</button>`
          : `<button class="save-btn" data-index="${index}">Save Lead</button>`;
        return `
          <div class="lead-card" data-index="${index}">
            <div class="lead-name">
              <span class="count-badge">${index + 1}</span>
              ${escapeHtml(lead.name)}
            </div>
            <div class="lead-address">📍 ${escapeHtml(lead.address)}</div>
            <div class="lead-phone">📞 ${lead.phone ? escapeHtml(lead.phone) : "No phone listed"}</div>
            <div class="card-actions">
              <span class="no-site-badge">No website</span>
              <a href="${mapsUrl}" target="_blank" rel="noopener">Google Maps →</a>
              ${saveBtnHtml}
            </div>
            ${inSavedView && lead.saved_at ? `<div class="saved-meta">Saved ${escapeHtml(lead.saved_at)}</div>` : ""}
          </div>`;
      }).join("");

      leadList.querySelectorAll(".save-btn:not(.saved)").forEach((btn) => {
        btn.addEventListener("click", (e) => {
          e.stopPropagation();
          saveLead(Number(btn.dataset.index), btn);
        });
      });

      leadList.querySelectorAll(".lead-card").forEach((card) => {
        card.addEventListener("click", () => {
          const lead = state.leads[Number(card.dataset.index)];
          if (!lead) return;
          const marker = state.markers[Number(card.dataset.index)];
          if (marker) {
            map.flyTo([lead.latitude, lead.longitude], 16, { duration: 0.8 });
            marker.openPopup();
          }
          highlightCard(Number(card.dataset.index));
        });
      });
    }

    function highlightCard(index) {
      leadList.querySelectorAll(".lead-card").forEach((c) => c.classList.remove("active"));
      const card = leadList.querySelector(`.lead-card[data-index="${index}"]`);
      if (card) {
        card.classList.add("active");
        card.scrollIntoView({ behavior: "smooth", block: "nearest" });
      }
    }

    // ------------------------------------------------------------------
    // Wire up events
    // ------------------------------------------------------------------
    scanBtn.addEventListener("click", scanForLeads);
    savedBtn.addEventListener("click", loadSavedLeads);
    exportBtn.addEventListener("click", exportCsv);

    keywordInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") scanForLeads();
    });

    // Enter key on the radius selector triggers too
    radiusSelect.addEventListener("keydown", (e) => {
      if (e.key === "Enter") scanForLeads();
    });

    // ------------------------------------------------------------------
    // Go
    // ------------------------------------------------------------------
    initLocation();
  </script>
</body>
</html>
